[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Unicode-DFS-2016 covers the Unicode character data
# that comrak's text handling embeds; it is OSI-approved and permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
