<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 517" width="860" height="517" role="img" aria-labelledby="t d">
<title id="t">The jired cycle in a terminal</title>
<desc id="d">jired pull writes three issues as Markdown files; one is edited offline; jired diff shows the changed summary and a new comment; jired push sends both to Jira.</desc>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 14px; white-space: pre; }
  .t { fill: #c9d1d9; } .d { fill: #7d8590; } .c { fill: #f0f6fc; font-weight: 600; }
  .p { fill: #7d8590; } .k { fill: #56d4dd; } .g { fill: #3fb950; } .r { fill: #f85149; }
  .b { fill: #f0f6fc; font-weight: 600; } .h { fill: #7d8590; font-size: 12.5px; }
</style>
<rect x="0.5" y="0.5" width="859" height="516" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 36.5h859" stroke="#21262d"/>
<circle cx="22" cy="18.5" r="6" fill="#f85149" opacity=".85"/><circle cx="42" cy="18.5" r="6" fill="#d29922" opacity=".85"/><circle cx="62" cy="18.5" r="6" fill="#3fb950" opacity=".85"/>
<text class="h" x="430.0" y="23" text-anchor="middle">~/my-sprint — jired</text>
<text x="26" y="62" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">jired pull</tspan></text>
<text x="26" y="83" xml:space="preserve"><tspan class="t">fetched 3 issue(s) from the server, 3 changed</tspan></text>
<text x="26" y="104" xml:space="preserve"><tspan class="g">  new       </tspan><tspan class="t">PROJ-142</tspan></text>
<text x="26" y="125" xml:space="preserve"><tspan class="g">  new       </tspan><tspan class="t">PROJ-143</tspan></text>
<text x="26" y="146" xml:space="preserve"><tspan class="g">  new       </tspan><tspan class="t">PROJ-150</tspan></text>
<text x="26" y="167" xml:space="preserve"><tspan class="t">3 new, 0 updated, 0 unchanged</tspan></text>
<text x="26" y="209" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">$EDITOR "PROJ-0142. Fix login flow.md"</tspan><tspan class="d">    # offline, in anything that edits Markdown</tspan></text>
<text x="26" y="251" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">jired diff</tspan></text>
<text x="26" y="272" xml:space="preserve"><tspan class="t">── </tspan><tspan class="k">PROJ-142</tspan><tspan class="d"> (modified)</tspan><tspan class="t"> PROJ-0142. Fix login flow.md</tspan></text>
<text x="26" y="293" xml:space="preserve"><tspan class="t">   summary    </tspan><tspan class="r">Fix login flow</tspan><tspan class="t"> → </tspan><tspan class="g">Fix the SSO login flow</tspan></text>
<text x="26" y="314" xml:space="preserve"><tspan class="b">   --- Comments/[new] ---</tspan></text>
<text x="26" y="335" xml:space="preserve"><tspan class="g">+Fixed by rotating the cert.</tspan></text>
<text x="26" y="377" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">jired push</tspan></text>
<text x="26" y="398" xml:space="preserve"><tspan class="t">── </tspan><tspan class="k">PROJ-142</tspan></text>
<text x="26" y="419" xml:space="preserve"><tspan class="t">   update_fields        summary</tspan><tspan class="g">  ✓</tspan></text>
<text x="26" y="440" xml:space="preserve"><tspan class="t">   create_comment       Fixed by rotating the cert.</tspan><tspan class="g">  ✓</tspan></text>
<text x="26" y="482" xml:space="preserve"><tspan class="t">pushed 1 issue(s)</tspan></text>
</svg>
