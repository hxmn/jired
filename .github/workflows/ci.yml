name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise: only the release job writes, a tag.
permissions:
  contents: read

# A newer push to the same ref makes the run for the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Tests must never touch a developer's or runner's real keychain.
  JIRED_NO_KEYRING: "1"
  JIRED_SECRET_KEY: ci-test-passphrase

# Actions are pinned by commit, with the version they were at beside each:
# a tag can be moved to other code, a commit cannot. Dependabot proposes the
# bumps (.github/dependabot.yml).
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `--locked` everywhere: what users build is `cargo install --locked`,
      # and a version bump pushed without its lockfile passed CI and then
      # failed that command for everyone.
      - run: cargo test --all-targets --locked
      # The scale suite is ignored by default because it writes thousands of
      # files; CI is exactly where that should still run.
      - run: cargo test --test scale --locked -- --ignored --nocapture

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Intra-doc links are checked nowhere else.
      - run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # `rust-version` in Cargo.toml is a promise; clippy's `incompatible_msrv`
  # catches a std API too new for it, not a language feature or a dependency
  # that moved past it after `cargo update`.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --all-targets --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt, rather than compiling cargo-deny on every run.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2

  # Every push to main is a release. Build it the way users do — the release
  # profile, `--locked` — and tag the version, so each one maps to a commit.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      - name: Tag the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
